{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Hospital Management</h1>
  <p class="subtitle">Smart bed allocation system</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit">Sign in</button>
  </form>
  <div class="demo">
    <div class="demo-title">Demo accounts</div>
    <ul class="demo-list">
      <li><span class="mono">admin</span><span class="role">Admin</span></li>
      <li><span class="mono">rahul, priya, kavya</span><span class="role">Doctor</span></li>
      <li><span class="mono">ananya</span><span class="role">Nurse</span></li>
      <li><span class="mono">riya</span><span class="role">Lab staff</span></li>
      <li><span class="mono">arjun</span><span class="role">Billing staff</span></li>
    </ul>
    <div class="demo-note">Password = username + 123</div>
  </div>
</div>
{% endblock %}
