{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<p class="subtitle">Signed in as <span class="mono">{{ session.username }}</span></p>
<div class="panel" style="max-width:440px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="old_password">Current password</label><input id="old_password" type="password" name="old_password" required autocomplete="current-password"></div>
    <div class="field"><label for="new_password">New password (at least 6 characters)</label><input id="new_password" type="password" name="new_password" minlength="6" required autocomplete="new-password"></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" minlength="6" required autocomplete="new-password"></div>
    <div class="actions"><button>Change password</button></div>
  </form>
</div>
{% endblock %}
